name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      # No ANTHROPIC_API_KEY needed here: every test that would call
      # Claude overrides the dependency with a fake client (see
      # tests/conftest.py and each test file's fixtures), and the
      # deterministic modules (KPI, workspaces) never touch it at all.
      - run: pytest -q
